{% extends 'base.html' %}
{% block title %}{{ 'Edit' if owner else 'New' }} Owner{% endblock %}
{% block content %}
<div class="page-header">
  <h1><i class="bi bi-person-plus me-2"></i>{{ 'Edit Owner' if owner else 'New Owner' }}</h1>
  <a href="/owners" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Back</a>
</div>

<div class="card">
  <div class="card-body">
    <form method="post" action="{{ '/owners/' + owner.id|string + '/edit' if owner else '/owners/new' }}">
      <div class="row g-3">
        <div class="col-12"><p class="fw-semibold text-muted small mb-0">Contact Info</p></div>
        <div class="col-12 col-md-6">
          <label class="form-label">Full Name *</label>
          <input type="text" name="name" class="form-control" value="{{ owner.name if owner else '' }}" required placeholder="e.g. Robert & Linda Harmon">
        </div>
        <div class="col-6 col-md-3">
          <label class="form-label">Phone</label>
          <input type="tel" name="phone" class="form-control" value="{{ owner.phone if owner else '' }}">
        </div>
        <div class="col-6 col-md-3">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-control" value="{{ owner.email if owner else '' }}">
        </div>
        <div class="col-6">
          <label class="form-label">Emergency Contact</label>
          <input type="text" name="emergency_contact" class="form-control" value="{{ owner.emergency_contact if owner else '' }}">
        </div>
        <div class="col-6">
          <label class="form-label">Emergency Phone</label>
          <input type="tel" name="emergency_phone" class="form-control" value="{{ owner.emergency_phone if owner else '' }}">
        </div>

        <div class="col-12"><hr class="my-1"><p class="fw-semibold text-muted small mb-0">Fees</p></div>
        <div class="col-6 col-md-3">
          <label class="form-label">Onboarding Fee</label>
          <div class="input-group">
            <span class="input-group-text">$</span>
            <input type="number" name="onboarding_fee" step="0.01" class="form-control" value="{{ owner.onboarding_fee if owner else '' }}">
          </div>
        </div>
        <div class="col-6 col-md-3">
          <label class="form-label">Reserve Fee</label>
          <div class="input-group">
            <span class="input-group-text">$</span>
            <input type="number" name="reserve_fee" step="0.01" class="form-control" value="{{ owner.reserve_fee if owner else '' }}">
          </div>
        </div>
        <div class="col-6 col-md-3">
          <label class="form-label">Renewal Fee</label>
          <div class="input-group">
            <span class="input-group-text">$</span>
            <input type="number" name="renewal_fee" step="0.01" class="form-control" value="{{ owner.renewal_fee if owner else '' }}">
          </div>
        </div>
        <div class="col-6 col-md-3">
          <label class="form-label">Monthly Mgmt Fee</label>
          <div class="input-group">
            <span class="input-group-text">$</span>
            <input type="number" name="monthly_mgmt_fee" step="0.01" class="form-control" value="{{ owner.monthly_mgmt_fee if owner else '' }}">
          </div>
        </div>

        <div class="col-12"><hr class="my-1"><p class="fw-semibold text-muted small mb-0">Contract & Insurance</p></div>
        <div class="col-6 col-md-3">
          <label class="form-label">Contract Status</label>
          <select name="contract_status" class="form-select">
            {% for s in contract_statuses %}<option {% if owner and owner.contract_status == s %}selected{% endif %}>{{ s }}</option>{% endfor %}
          </select>
        </div>
        <div class="col-6 col-md-3">
          <label class="form-label">Insurance Status</label>
          <select name="landlord_insurance_status" class="form-select">
            {% for s in insurance_statuses %}<option {% if owner and owner.landlord_insurance_status == s %}selected{% endif %}>{{ s }}</option>{% endfor %}
          </select>
        </div>
        <div class="col-6 col-md-3">
          <label class="form-label">Insurance Expiry</label>
          <input type="date" name="landlord_insurance_expiry" class="form-control" value="{{ owner.landlord_insurance_expiry.isoformat() if owner and owner.landlord_insurance_expiry else '' }}">
        </div>
        <div class="col-12">
          <label class="form-label">Notes</label>
          <textarea name="notes" class="form-control" rows="3" placeholder="Communication preferences, special instructions…">{{ owner.notes if owner else '' }}</textarea>
        </div>
      </div>
      <div class="mt-4 d-flex gap-2">
        <button type="submit" class="btn btn-navy px-4">
          <i class="bi bi-check-circle me-1"></i>{{ 'Update Owner' if owner else 'Save Owner' }}
        </button>
        <a href="/owners" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
